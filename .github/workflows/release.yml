name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  # 1. Changesets bot keeps a "Version Packages" PR open. Merging it
  #    bumps versions, writes CHANGELOG.md, tags, and emits a GitHub Release.
  release:
    name: Version or release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.7.0
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # No NPM_TOKEN secret is involved — the workflow's `id-token: write`
      # permission (declared at workflow scope above) plus a trusted-publisher
      # entry on npmjs.com is what authorises the publish. Node 25 ships
      # npm 11.x which speaks the OIDC exchange natively.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Changesets — version PR, publish public, tag private
        id: changesets
        uses: changesets/action@v1
        with:
          # `changeset publish` publishes any non-private packages to npm
          # (currently just @rocketmakers/filter, with provenance enabled
          # via its publishConfig) and tags every package — including the
          # private @filter-builder/* demos — for GitHub Releases.
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: "chore: release"
          title: "chore: release"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. After a release is cut (or on every push if you'd rather track main),
  #    rebuild the shadcn registry and deploy it to GitHub Pages.
  deploy-registry:
    name: Deploy registry to GitHub Pages
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25.7.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm build:registry

      - name: Add landing page
        run: |
          cat > registry-dist/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>filter-builder registry</title></head>
          <body style="font-family:system-ui;max-width:42rem;margin:4rem auto;padding:0 1rem;line-height:1.55">
          <h1>filter-builder</h1>
          <p>Three flavours of the same compound <code>FilterBuilder</code> component.</p>

          <h2>Tailwind (shadcn registry)</h2>
          <pre><code>npx shadcn@latest add https://rocketmakers.github.io/filter/r/filter-builder-tailwind.json</code></pre>

          <h2>Mantine or StyleX</h2>
          <pre><code>npx @rocketmakers/filter mantine
          npx @rocketmakers/filter stylex</code></pre>
          <p>The CLI fetches the matching manifest from this site, writes the source into your <code>src/</code>, and installs the npm dependencies.</p>

          <p><a href="https://github.com/Rocketmakers/filter">Source on GitHub</a></p>
          </body></html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: registry-dist

      - id: deployment
        uses: actions/deploy-pages@v4
